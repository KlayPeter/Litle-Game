<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>极限泊车 · 七点，海边见</title><link rel="stylesheet" href="parking.css"></head><body>
<header><a href="./">↗ 上班下班</a><nav><a href="flick.html">弹射停车</a><a href="race.html">路线挑战</a><a href="jiditie/">挤地铁</a></nav></header>
<main><aside><p class="eyebrow">第一幕 / 阿停的最后一个车位</p><h1>晚饭到了。<br>车还没<span>停好。</span></h1><p class="intro">“你们先点菜，我再倒一把。”<br>慢慢来，留给车头一点空间。</p><div id="levels" class="levels"></div><div class="instructions"><b>方向盘 + 前进 / 倒车</b><p>左手左右拖动方向盘，右手按住踏板。<br>松开踏板即刹停，松开方向盘即回正。</p><p>电脑：← → 转向，↑ ↓ 前进 / 倒车。<br>无倒计时。擦碰后仍可继续练习。</p></div><a href="flick.html" class="switch">想轻松一点？去弹射停车 ↗</a></aside>
<section class="game"><div class="top"><div><small id="location"></small><h2 id="title"></h2></div><span class="badge">不限时 · 精准挑战</span></div><div class="metrics"><span>擦碰 <b id="hits">0</b></span><span>换向 <b id="shifts">0</b></span><span id="progress">等待入位</span></div><div class="arena"><canvas id="scene" width="520" height="550" aria-label="停车场，使用下方方向盘和前进倒车按钮驾驶"></canvas><div id="result" hidden><small>阿停：停好了！晚饭还是热的。</small><h2 id="stars"></h2><p id="resultText"></p><button id="next">下一处停车场 →</button><button id="again">再来一次，少倒一把</button></div></div><p id="status" role="status"></p><div class="controls"><div class="steering"><div id="wheel" role="slider" tabindex="0" aria-label="方向盘，左右拖动或使用方向键" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span>╱│╲</span></div><small>← 左右拖动转向 →</small></div><div class="actions"><button id="forward">↑<span>前进</span></button><button id="reverse">↓<span>倒车</span></button></div></div><div class="tools"><button id="undo">↶ 回退上一把</button><button id="restart">重新停车</button><span>完整入位 · 角度摆正 · 停稳 1 秒</span></div></section></main><script type="module" src="parking.mjs"></script></body></html>
